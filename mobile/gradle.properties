# Propriedades do projeto Android
# Ativa AndroidX (obrigatório para bibliotecas modernas)
android.useAndroidX=true
# Permite compilação paralela para builds mais rápidos
org.gradle.parallel=true
# Alocação de memória para o Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Permite builds não transitivas para melhor performance
android.nonTransitiveRClass=true
